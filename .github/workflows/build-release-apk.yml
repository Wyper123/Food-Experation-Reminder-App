# Builds the release APK on GitHub's servers (Windows Smart App Control
# blocks Flutter's release compiler on the development PC).
#
# Runs on every push to main, or manually: Actions tab → this workflow →
# "Run workflow". Download the APK from the run's "Artifacts" section.
name: Build release APK

on:
  push:
    # main = current version; v2 = next version under test.
    branches: [main, v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # Unit/widget tests use SQLite through FFI.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      - name: Test
        run: flutter test

      # The permanent signing key, from repository secrets. Without it the
      # APK is signed with a throwaway key and cannot update an installed app.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret; using a throwaway key."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: food-reminder-${{ github.ref_name }}-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
