# Builds the release APK on GitHub's servers (Windows Smart App Control
# blocks Flutter's release compiler on the development PC).
#
# Runs on every push to main, or manually: Actions tab → this workflow →
# "Run workflow". Download the APK from the run's "Artifacts" section.
name: Build release APK

on:
  push:
    # main = current version; v2 = next version under test.
    branches: [main, v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # Unit/widget tests use SQLite through FFI.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: food-reminder-${{ github.ref_name }}-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
